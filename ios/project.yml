name: SnapWeb
options:
  bundleIdPrefix: com.blabla1337
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.blabla1337.snapweb
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSCameraUsageDescription: "Used by Snapchat Web for snaps and video calls."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Used by Snapchat Web for voice and video calls."
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  SnapWeb:
    type: application
    platform: iOS
    sources:
      - Sources
schemes:
  SnapWeb:
    build:
      targets:
        SnapWeb: all
    run:
      config: Debug
