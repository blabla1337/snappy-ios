  # Starter config for Codemagic (https://codemagic.io). Verify instance_type
  # names and image versions against current Codemagic docs before relying on it.
  # GitHub Actions in .github/workflows/build.yml is the fully-wired path.
  workflows:
    android:
      name: SnapWeb Android
      instance_type: linux_x2
      environment:
        java: 17
      scripts:
        # Single step: observed on linux_x2 that the wrapper files produced in a
        # prior `script` entry were missing from the next one. Collapsing to one
        # script keeps everything in the same shell execution so the generated
        # gradlew is guaranteed to be present at build time.
        - name: Generate wrapper and build debug APK
          script: |
            # The system Gradle on this image is 8.1.1. Running `gradle wrapper`
            # inside android/ would evaluate build.gradle.kts and apply AGP,
            # which requires 8.7+, so the step fails before it can rewrite the
            # wrapper. Generate the wrapper in a scratch dir (no AGP on the
            # classpath), then copy the artefacts into android/.
            set -eux
            mkdir -p /tmp/gw && cd /tmp/gw
            : > settings.gradle
            gradle wrapper --gradle-version 8.7 --distribution-type all
            cd -
            cp /tmp/gw/gradlew android/gradlew
            cp /tmp/gw/gradlew.bat android/gradlew.bat
            cp /tmp/gw/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
            cd android && ./gradlew assembleDebug
      artifacts:
        - android/app/build/outputs/**/*.apk

    ios_simulator:
      name: SnapWeb iOS (unsigned simulator)
      instance_type: mac_mini_m2
      scripts:
        - name: Generate Xcode project
          script: cd ios && brew install xcodegen && xcodegen generate
        - name: Build unsigned
          script: |
            cd ios && xcodebuild \
              -project SnapWeb.xcodeproj -scheme SnapWeb \
              -sdk iphonesimulator -configuration Debug \
              CODE_SIGNING_ALLOWED=NO build

    ios_testflight:
      name: SnapWeb iOS (signed, TestFlight)
      instance_type: mac_mini_m2
      environment:
        xcode: latest
        vars:
          BUNDLE_ID: "com.yourname.snapweb"
          XCODE_PROJECT: "SnapWeb.xcodeproj"
          XCODE_SCHEME: "SnapWeb"
          APP_STORE_APP_ID: 6818642219
      integrations:
        app_store_connect: codemagic
      scripts:
        - name: Generate Xcode project
          script: cd ios && brew install xcodegen && xcodegen generate
        - name: Set up signing
          script: |
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" \
              --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles
        - name: Bump build number
          script: |
            cd ios
            LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo 0)
            agvtool new-version -all $((LATEST + 1))
        - name: Build signed IPA
          script: |
            cd ios && xcode-project build-ipa \
              --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
      artifacts:
        - ios/build/ios/ipa/*.ipa
        - /tmp/xcodebuild_logs/*.log
        - ios/build/ios/xcarchive/*.xcarchive/dSYMs
      publishing:
        app_store_connect:
          auth: integration
          submit_to_testflight: true

